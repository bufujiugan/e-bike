server:
  port: ${BIKE_SERVER_PORT:18080}

spring:
  application:
    name: bike-server
  servlet:
    multipart:
      max-file-size: ${BIKE_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${BIKE_UPLOAD_MAX_REQUEST_SIZE:160MB}
  datasource:
    url: ${BIKE_DB_URL:jdbc:mysql://localhost:3306/bike?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BIKE_DB_USERNAME:root}
    password: ${BIKE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${BIKE_FLYWAY_ENABLED:true}
    locations: ${BIKE_FLYWAY_LOCATIONS:classpath:db/migration}
    table: bike_schema_history
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bike:
  production:
    storage: ${BIKE_PRODUCTION_STORAGE:local}
    file-root: ${BIKE_PRODUCTION_FILE_ROOT:./storage/production}
    cos:
      region: ${BIKE_COS_REGION:}
      bucket: ${BIKE_COS_BUCKET:}
      secret-id: ${BIKE_COS_SECRET_ID:}
      secret-key: ${BIKE_COS_SECRET_KEY:}
  security:
    admin-username: ${BIKE_ADMIN_USERNAME:admin}
    admin-password: ${BIKE_ADMIN_PASSWORD:}
    admin-password-is-hash: ${BIKE_ADMIN_PASSWORD_IS_HASH:false}
    jwt-secret: ${BIKE_JWT_SECRET:}
    token-ttl: ${BIKE_JWT_TTL:PT8H}
