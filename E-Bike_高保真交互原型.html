 const customer=role==='customer';const roleName=({admin:'公司管理后台',customer:'客户服务门户',technical:'技术工作台',warehouse:'仓库工作台'})[role]||'公司管理后台';
 const titles={dashboard:'服务概览',cases:'案例管理',detail:'案例详情',new:'新建售后案例',approvals:'审核与审批',shipments:'配件发运',dealers:'客户与账号',vehicles:'整车档案',inventory:'库存管理',production:'生产组装'};
 app.innerHTML=`<aside class="sidebar" id="sidebar"><a href="#dashboard" class="brand"><span class="brand-mark">${icon('bolt',24)}</span><span><strong>E-BIKE</strong><small>OPERATIONS & SERVICE</small></span></a><div class="workspace-chip"><span class="dot"></span>${customer?'Built Bikes · 合作伙伴':roleName}${icon('down',13)}</div><div class="nav-label">${customer?'服务与支持':'工作空间'}</div>${nav('dashboard',customer?'服务首页':'服务概览','grid')}${nav('cases',customer?'我的售后案例':'售后案例','file',String(visibleCases().filter(c=>c.status!=='完成').length))}${customer?nav('new','案例申报','plus'):nav('approvals','审核与审批','shield')}${customer?'':nav('shipments','配件发运','truck')}${!customer&&role==='admin'?`<div class="nav-label">生产与库存</div>${nav('production','生产组装','tool')}${nav('vehicles','整车档案','bike')}${nav('inventory','库存管理','box')}<div class="nav-label">合作伙伴</div>${nav('dealers','客户与账号','users')}`:''}<div class="nav-label">资源中心</div><button class="nav-item" data-action="knowledge">${icon('book')}<span>售后知识库</span><em class="future">后期</em></button><div class="sidebar-bottom"><div class="support-card"><strong>让服务连接每一程</strong><p>从生产档案，到售后每一个细节。</p><button class="link small" data-action="guide">原型导览 ${icon('arrow',13)}</button></div><div class="profile"><div class="avatar dark">${customer?'CW':role==='technical'?'EV':role==='warehouse'?'WM':'NL'}</div><div><strong>${customer?'Chris Wilson':role==='technical'?'Evan · 技术工程师':role==='warehouse'?'Will · 仓库专员':'Nia Lee · 售后主管'}</strong><p>${customer?'Built Bikes · 英国':'E-Bike 服务团队'}</p></div><button class="link" data-action="guide" aria-label="原型说明">${icon('settings',16)}</button></div></div></aside>
 <div class="main"><header class="topbar"><div class="flex"><button class="icon-btn mobile-menu" data-action="menu" aria-label="打开导航">${icon('menu')}</button><div class="breadcrumbs">${customer?'服务与支持':'工作台'} <span style="margin:0 10px;color:#ccd5d1">/</span> <b>${titles[route()]||'服务概览'}</b></div></div><div class="top-actions"><span class="role-badge">交互原型 · 演示数据</span><form id="global-search" class="top-search">${icon('search',16)}<input name="search" aria-label="全局搜索案例" placeholder="搜索案例 / 车架号"><kbd>↵</kbd></form><select id="role" class="role-switch" aria-label="切换原型角色">${[['admin','公司后台'],['customer','客户门户'],['technical','技术人员'],['warehouse','仓库人员']].map(([v,l])=>`<option value="${v}" ${role===v?'selected':''}>${l}</option>`).join('')}</select><button class="icon-btn" data-action="notifications" aria-label="通知中心">${icon('bell',16)}<i class="unread"></i></button><div class="avatar">${customer?'CW':'NL'}</div></div></header><main class="content">${content}<footer class="demo-footer"><span>© 2026 E-Bike · 每一辆车，全程可追溯</span><a data-action="guide">高保真交互原型 V1.0 · 方案待确认 ${icon('arrow',11)}</a></footer></main></div>`;
}
function heading(title,subtitle,actions='',eyebrow='SERVICE WORKSPACE'){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="flex">${actions}</div></div>`}
function metrics(customer=false){const all=visibleCases(), data=customer?[
 ['我的案例',all.length,'grid','本公司已提交案例','全部案例'],['处理中',all.filter(c=>c.status==='处理中').length,'tool','查看最新处理进度','处理中'],['等待我回复',all.filter(c=>c.sub==='等待客户回复').length,'chat','补充资料，推进处理','等待客户回复'],['已完成',all.filter(c=>c.status==='完成').length,'check','服务记录持续保留','完成']
 ]:[['待处理案例',all.filter(c=>c.status==='已提交').length,'file','等待售后团队受理','待处理'],['审核中',all.filter(c=>c.status==='审核中').length,'shield','技术团队正在确认','审核中'],['待发货配件',all.filter(c=>c.sub==='待发货').length,'truck','已批准，可安排发运','待发货'],['本月已完成',all.filter(c=>c.status==='完成').length,'check','已解决并归档','完成']];return `<div class="metrics">${data.map(([label,n,ic,foot,f])=>`<button class="card metric" data-filter="${f}"><div class="metric-label">${label}<span class="metric-icon">${icon(ic,16)}</span></div><div class="metric-number">${String(n).padStart(2,'0')}<span>件</span></div><div class="metric-foot"><b>${label.includes('完成')?'✓ 服务闭环':'● 当前待办'}</b>${foot}</div></button>`).join('')}</div>`}
function chart(){return `<svg class="chart" viewBox="0 0 620 180" preserveAspectRatio="none" role="img" aria-label="月度趋势演示：最近七天新增及完成案例"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bedacd" stop-opacity=".6"/><stop offset="1" stop-color="#eaf4ed" stop-opacity=".05"/></linearGradient></defs>${[25,60,95,130].map((y,i)=>`<path d="M28 ${y}H610" stroke="#edf1ed" stroke-dasharray="3 5"/><text x="2" y="${y+4}">${[12,8,4,0][i]}</text>`).join('')}<path d="M30 108C62 109 86 76 125 80S185 112 220 91S281 43 316 59S377 90 410 66S466 58 507 39S570 40 607 17V143H30Z" fill="url(#area)"/><path d="M30 125C75 125 82 107 125 111S180 89 220 110S276 87 316 91S370 102 410 94S466 66 507 80S570 71 607 73" fill="none" stroke="#bfd0bf" stroke-width="2" stroke-dasharray="5 4"/><path d="M30 108C62 109 86 76 125 80S185 112 220 91S281 43 316 59S377 90 410 66S466 58 507 39S570 40 607 17" fill="none" stroke="#347e67" stroke-width="2.4"/><circle cx="410" cy="66" r="4" fill="white" stroke="#347e67" stroke-width="2"/>${['09/03','09/04','09/05','09/06','09/07','09/08','09/09'].map((d,i)=>`<text x="${25+i*94}" y="168">${d}</text>`).join('')}</svg>`}
function caseTable(list,compact=false){return `<div class="table-scroll"><table><thead><tr><th>案例编号 / 创建日期</th>${role==='customer'?'':'<th>客户 / 地区</th>'}<th>产品 / 故障部件</th><th>案例状态</th>${compact?'':'<th>保修状态</th>'}<th>负责人</th><th></th></tr></thead><tbody>${list.length?list.map(c=>`<tr><td><button class="link case-id" data-case="${esc(c.id)}">${esc(c.id)}</button><span class="cell-sub mono">${esc(c.date)} 10:28</span></td>${role==='customer'?'':`<td><div class="customer-cell"><span class="company-mark ${c.company==='Vélo Horizon'?'blue':''}">${esc(c.company.slice(0,1))}</span><div>${esc(c.company)}<span class="cell-sub">${esc(c.country)}</span></div></div></td>`}<td><span class="bold">${esc(c.model)}</span><span class="cell-sub">${esc(c.fault)}${c.code&&c.code!=='-'?' · '+esc(c.code):''}</span></td><td>${badge(c.status)}<span class="cell-sub">${esc(c.sub)}</span></td>${compact?'':`<td><span class="tag ${c.warranty==='保修内'?'outline':'amber'}">${esc(c.warranty)}</span></td>`}<td><div class="flex" style="gap:7px"><span class="avatar" style="width:24px;height:24px;font-size:9px">${esc(c.owner?.slice(0,1)||'N')}</span>${esc(c.owner)}</div></td><td><button class="icon-btn" data-case="${esc(c.id)}" aria-label="查看案例 ${esc(c.id)}">${icon('chevron',13)}</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">${icon('search',28)}<p style="margin-top:12px">没有找到符合条件的案例</p><button class="link" data-action="reset-filter">清除筛选</button></td></tr>`}</tbody></table></div>`}
function dashboard(){const customer=role==='customer';const all=visibleCases();return heading(customer?'欢迎回来，Chris':'早上好，Nia','每一个案例，都值得被认真对待。',`<span class="date-chip">${icon('calendar',13)} 2026 年 9 月 9 日，星期三</span>`,customer?'PARTNER SERVICE PORTAL':'SERVICE OVERVIEW')+
 `<section class="hero"><div class="hero-copy"><div class="eyebrow">${customer?'YOUR RIDE. OUR COMMITMENT.':'CONNECTED SERVICE. EVERY MILE.'}</div><h2>${customer?'服务始终在线，\n骑行安心向前。'.replace('\n','<br>'):'每一次服务，都有迹可循。'}</h2><p>${customer?'提交售后需求、查看维修方案与配件进度。':'从问题申报到解决归档，让协作更顺畅，让服务更透明。'}</p>${btn(customer?'申报售后案例':'进入案例工作台',customer?'new':'cases','primary',customer?'plus':'arrow')}</div><div class="hero-art">${bike()}</div><span class="hero-decoration">E-BIKE / SERVICE</span><span class="hero-caption">TRAIL X1 · ELECTRIC MOUNTAIN BIKE</span></section>`+metrics(customer)+
 `<div class="dashboard-grid"><section class="card card-pad"><div class="section-head"><div><h2>${customer?'最近服务动态':'案例处理趋势'}</h2><p>${customer?'你的每一次沟通，都有回响':'最近 7 天 · 示意数据，统计分析为后期功能'}</p></div>${customer?'':`<div class="legend"><span><i></i>新增</span><span><i class="light"></i>完成</span></div>`}</div>${customer?`<div class="task-list">${all.slice(0,3).map(c=>`<div class="task" data-case="${c.id}"><span class="task-icon green">${icon(c.status==='已发货'?'truck':'chat',17)}</span><div><strong>${c.status==='已发货'?'您的补发配件已发出':'售后团队更新了处理进度'}</strong><p>${c.id} · ${c.sub}</p></div>${icon('chevron',13)}</div>`).join('')}</div>`:chart()}</section><section class="card card-pad"><div class="section-head"><div><h2>${customer?'专属售后支持':'待办提醒'}</h2><p>${customer?'Built Bikes · 经销商服务':'聚焦需要你推进的事项'}</p></div><span class="tag green">${customer?'已连接':'今日'}</span></div><div class="task-list">${customer?`<div class="flex"><span class="avatar" style="height:46px;width:46px">NL</span><div><h3>Nia Lee</h3><p class="small muted">你的售后服务负责人</p></div></div><p class="small muted">案例中的问题，请直接在对应工单留言。维修方案和沟通记录将始终保留。</p>${btn('查看我的案例','cases','soft','file')}`:[['file','新案例等待受理','待处理',`${all.filter(c=>c.status==='已提交').length} 件`],['chat','等待客户补充资料','等待客户回复',`${all.filter(c=>c.sub==='等待客户回复').length} 件`],['truck','配件已批准，待发运','待发货',`${all.filter(c=>c.sub==='待发货').length} 件`]].map(([ic,label,f,n])=>`<div class="task" data-filter="${f}"><span class="task-icon ${ic==='truck'?'green':''}">${icon(ic,17)}</span><div><strong>${label}</strong><p>${ic==='chat'?'持续跟进客户回复':'及时推进案例处理'}</p></div><time>${n}</time><span class="task-arrow">${icon('chevron',12)}</span></div>`).join('')}</div></section></div>`+
 `<section class="card table-card"><div class="table-head section-head"><div><h2>${customer?'我的最近案例':'最近售后案例'}</h2><p>${customer?'仅展示 Built Bikes 公司的演示案例':'申报、审核、维修与发运，在这里协同'}</p></div><button class="link small" data-nav="cases">查看全部 ${icon('arrow',13)}</button></div>${caseTable(all.slice(0,4),true)}<div class="table-footer"><span>共 ${all.length} 个案例 · 最近更新于 10:32</span><span>${icon('shield',12)} ${customer?'公司数据独立可见':'数据按角色及客户权限展示'}</span></div></section>`}
function casesPage(approval=false){if(approval&&filter==='全部案例')filter='审核中';const list=filtered(),perPage=8,total=Math.ceil(list.length/perPage)||1;pageNum=Math.min(pageNum,total);return heading(approval?'审核与审批':role==='customer'?'我的售后案例':'售后案例',approval?'让每一份方案，都经过可靠确认。':'集中处理客户问题，记录每一次服务进展。',`${btn('导出清单','export','','download')}${btn('新建案例','new','primary','plus')}`,approval?'REVIEW & APPROVAL':'AFTER-SALES CASES')+
 `<div class="card summary-strip">${[['全部案例',visibleCases().length],['处理中',visibleCases().filter(c=>c.status==='处理中').length],['等待客户回复',visibleCases().filter(c=>c.sub==='等待客户回复').length],['已发货',visibleCases().filter(c=>c.status==='已发货').length]].map(([s,n])=>`<div class="summary-item"><span>${s}</span><strong>${String(n).padStart(2,'0')}</strong></div>`).join('')}</div><section class="card table-card"><div class="tabs">${['全部案例','待处理','审核中','处理中','待发货','已发货','完成'].map(s=>`<button class="tab ${filter===s?'active':''}" data-list-filter="${s}">${s==='完成'?'已完成':s}${s==='全部案例'?`<span class="tab-count">${visibleCases().length}</span>`:''}</button>`).join('')}</div><form class="filters" id="case-filters"><div class="search-control">${icon('search',15)}<input name="query" value="${esc(query)}" placeholder="案例编号 / 客户 / 车架号" aria-label="案例搜索"></div><select name="country" class="filter-select" aria-label="国家筛选"><option value="">所有国家 / 地区</option>${['英国','法国','西班牙','巴西'].map(v=>`<option ${country===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn soft" type="submit">查询</button><button class="link small" type="button" data-action="reset-filter">重置</button><span class="grow"></span><span class="small muted">${list.length} 个结果</span></form>${caseTable(list.slice((pageNum-1)*perPage,pageNum*perPage))}<div class="table-footer"><span>共 ${list.length} 条案例 · 每页 8 条</span><div class="pager"><button data-page="${pageNum-1}" ${pageNum<=1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:total},(_,i)=>`<button data-page="${i+1}" class="${pageNum===i+1?'selected':''}">${i+1}</button>`).join('')}<button data-page="${pageNum+1}" ${pageNum>=total?'disabled':''} aria-label="下一页">›</button></div></div></section>`}
function infoField(label,value,cls=''){return `<div class="${cls}"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`}
function progress(c){const steps=['已提交','审核中','已审批','处理中','已发货','完成'];let n=steps.indexOf(c.status);if(n<0)n=0;return `<div class="card progress-card"><div class="progress-line">${steps.map((s,i)=>`<div class="step ${i<n?'done':i===n?'current':''}"><span class="step-circle">${i<n?icon('check',12):i+1}</span><strong>${s}</strong><small>${i<n?'已完成':i===n?'当前阶段':'待推进'}</small></div>`).join('')}</div></div>`}
function infoTab(c){return `<section class="detail-section"><h3 class="subheading">车辆信息</h3><div class="vehicle-preview">${bike()}<div><h3>${esc(c.model)} <span class="tag outline small">${esc(c.warranty)}</span></h3><p>电助力山地车 · Moss Green / M</p><p class="mono">Frame SN: ${esc(c.frame)}</p></div><span class="grow"></span><button class="link small" data-action="vehicle-link">整车档案 ${icon('arrow',12)}</button></div><div class="fields">${infoField('车架号',esc(c.frame))}${infoField('电机序列号',esc(c.motor||'MOT-26-00158'))}${infoField('电池序列号',esc(c.battery||'BAT-26-00821'))}${infoField('仪表序列号',esc(c.display||'DSP-26-00316'))}${infoField('经销商购买日期',esc(c.purchase||'2026-06-12'))}${infoField('最终客户购买日期',esc(c.finalPurchase||'2026-07-02'))}</div></section><section class="detail-section"><div class="flex between"><h3 class="subheading">故障申报</h3><span class="tag amber">${esc(c.fault)}问题</span></div><div class="fields">${infoField('故障部件',esc(c.fault))}${infoField('故障代码',`<span class="tag">${esc(c.code||'-')}</span>`)}${infoField('故障发生时间',esc(c.faultDate||'2026-09-04'))}${infoField('问题描述',esc(c.description),'full')}${infoField('已尝试的维修方式',esc(c.attempted||'重新启动系统，检查电机连接线，故障仍间歇性出现。'),'full')}</div></section><section class="detail-section"><h3 class="subheading">图片与附件 <span class="muted small">${c.attachments?.length||3} 个文件</span></h3><div class="attachment-grid">${(c.attachments?.length?c.attachments:['motor_detail.jpg','error_code.mp4','diagnostic_report.pdf']).map((name,i)=>`<button class="attachment" data-preview="${esc(name)}"><div class="attachment-visual">${i===0?`<svg width="100" height="70" viewBox="0 0 100 70" role="img" aria-label="电机示意"><path d="M22 22h50l12 16-9 17H30L17 41z" fill="#586c5c"/><circle cx="48" cy="39" r="20" fill="#354d40"/><circle cx="48" cy="39" r="12" fill="#7c8e76"/><circle cx="48" cy="39" r="6" fill="#3e5544"/><path d="M65 20l12-10" stroke="#536d56" stroke-width="5"/></svg>`:icon(i===1?'image':'file',31)}</div><div class="attachment-name">${esc(name)}<sma function repairTab(c){return `<div class="flex between"><h3 class="subheading">维修方案</h3><span class="tag ${c.status==='审核中'?'amber':'green'}">${c.status==='审核中'?'待技术确认':'技术已确认'}</span></div><div class="fields">${infoField('技术工程师','Evan Chen')}${infoField('方案更新时间','2026-09-09 09:30')}${infoField('是否需要换件','是 · 免费保修')}${infoField('故障判断',esc(c.solution||'电机信号异常，建议先执行交叉测试，以确认故障来源。'),'full')}</div><div class="solution"><h3>建议维修步骤</h3><ol><li>检查电机接插件及线束连接，确认无松动或氧化。</li><li>使用同型号电机进行交叉测试，并记录仪表故障代码。</li><li>若问题仍然存在，请上传诊断报告，由技术人员继续确认。</li></ol></div><h3 class="subheading">建议更换的配件</h3><div class="table-scroll"><table><thead><tr><th>配件 / 编号</th><th>数量</th><th>费用类型</th><th>旧件要求</th></tr></thead><tbody><tr><td>${esc(c.fault)}组件<span class="cell-sub">EB-PART-0261</span></td><td>${c.parts||1} 件</td><td><span class="tag green">保修免费</span></td><td>需退回 · 待确认</td></tr></tbody></table></div><div class="notice">示意方案，仅用于评审页面与业务流程。实际技术结论和保修责任需由技术人员审核。</div>${role!=='customer'&&role!=='warehouse'?`<div class="flex end">${btn('编辑维修方案','edit-solution','','tool')}${['审核中','已提交'].includes(c.status)?btn('提交审批','request-approval','primary','arrow'):''}</div>`:''}`}

function production(){return heading('生产组装','四码关联，建立每一辆 E-Bike 的完整生产档案。',btn('演示工位扫码','scan','primary','plus'),'ASSEMBLY WORKSPACE')+`<div class="step-rail">${[['车架建档','24','车架 SN 作为业务唯一标识'],['部件绑定','18','电机、电池、仪表唯一绑定'],['组装完成','16','生成整车总二维码']].map(([l,n,p],i)=>`<div class="card"><div class="flex between"><h3>${l}</h3><span class="tag green">工位 ${i+1}</span></div><strong>${n}<small class="muted" style="font-size:11px;font-weight:400"> 台</small></strong><p>${p}</p></div>`).join('')}</div><section class="card card-pad"><div class="section-head"><h2>最近组装记录</h2><span class="small muted">演示数据</span></div><div class="table-scroll"><table><thead><tr><th>车架号</th><th>车型</th><th>四码状态</th><th>工位</th><th>更新时间</th><th></th></tr></thead><tbody>${cases.slice(0,5).map(c=>`<tr><td>${esc(c.frame)}</td><td>${esc(c.model)}</td><td><span class="tag green">四码已关联</span></td><td>总装工位</td><td>2026-09-09 09:26</td><td><button class="link" data-vehicle="${c.id}">查看档案 ${icon('arrow',13)}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function render(){let r=route();if(role==='customer'&&['approvals','shipments','dealers','inventory','production'].includes(r)){go('dashboard');return}if(role==='warehouse'&&['approvals','dealers','inventory','production','new'].includes(r)){go('shipments');return}shell(({dashboard,cases:()=>casesPage(),approvals:()=>casesPage(true),detail,new:newCase,shipments,vehicles,dealers,inventory,production}[r]||dashboard)());document.title=`E-Bike · ${({dashboard:'服务概览',detail:'案例详情',new:'案例申报',cases:'售后案例'}[r]||'服务平台')}`;}

function openModal(title,content,wide=false){modalPreviousFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">${icon('close',17)}</button></div>${content}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.modal input,.modal textarea,.modal select,.modal button')?.focus(),20)}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';modalPreviousFocus?.focus?.()}
function modalField(label,name,value='',type='text',required=true){return `<div class="input-field"><label>${label}${required?'<i>*</i>':''}</label><input name="${name}" aria-label="${label}" value="${esc(value)}" type="${type}" ${required?'required':''}></div>`}
function modalActions(text='确认保存'){return `<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">${text} ${icon('check',14)}</button></div>`}
function audit(c,text){c.history.unshift({time:'2026-09-09 10:32',who:role==='customer'?'Chris Wilson · 客户':role==='technical'?'Evan · 技术':role==='warehouse'?'Will · 仓库':'Nia · 售后',text});persist()}

 case 'ship':openModal(c.tracking?'更新发运信息':'登记配件发货',`<p>${esc(c.id)} · ${esc(c.fault)}组件 × ${c.parts||1}</p><form id="shipping-form"><div class="form-fields">${modalField('收货人','recipient',c.contact)}${modalField('联系电话','phone',c.phone||'+44 20 7946 0821')}<div class="full">${modalField('收货地址','address',c.address||'12 Cycling Avenue, London')}</div>${modalField('邮政编码','postal',c.postal||'E1 6AN')}${modalField('快递公司','carrier',c.carrier||'DHL Express')}${modalField('物流单号','tracking',c.tracking)}${modalField('发货日期','shipDate',c.shipDate||'2026-09-09','date')}${modalField('预计到达日期','eta',c.eta||'2026-09-14','date',false)}</div><div class="notice">补发登记不自动扣减整车库存。库存联动和多批次发运需另行确认；本次为单次发运演示。</div>${modalActions('确认发货')}</form>`);break;
 case 'complete':openModal('确认问题已经解决',`<p>完成后，案例资料、维修方案、沟通与发运历史仍可查询。</p><form id="complete-form"><div class="input-field"><label>解决说明<i>*</i></label><textarea name="reason" required aria-label="解决说明" placeholder="请说明测试结果或问题解决情况"></textarea></div><div class="notice">是否由客户确认完成，以及旧件是否必须闭环后才能结案，属于待确认规则。</div>${modalActions('确认完成并归档')}</form>`);break;
 case 'status':openModal('更新案例状态',`<form id="status-form"><div class="input-field"><label>目标状态</label><select name="status" aria-label="目标状态">${['审核中','处理中','完成'].map(v=>`<option ${v===c.status?'selected':''}>${v}</option>`).join('')}</select></div><div class="input-field" style="margin-top:16px"><label>变更说明<i>*</i></label><textarea name="reason" required aria-label="变更说明"></textarea></div><div class="notice">发货请使用“登记发货”，审批请使用审批操作。正式状态流转权限需按最终业务规则实现。</div>${modalActions('更新状态')}</form>`);break;
 case 'return-parts':openModal('旧件处理 · 阶段待确认',`<form id="return-form"><div class="form-fields"><div class="input-field"><label>旧件状态</label><select name="returnStatus" aria-label="旧件状态">${(role==='customer'?['等待客户寄回','客户已寄出']:['无需退回','需要退回','等待客户寄回','客户已寄出','公司已收到','已检测','已报废','已完成']).map(v=>`<option ${v===c.returnStatus?'selected':''}>${v}</option>`).join('')}</select></div>${modalField('寄回物流单号','returnTracking',c.returnTracking||'','text',false)}</div><div class="notice">本页用于确认旧件处理方案，不代表该模块已确定纳入第一阶段。</div>${modalActions()}</form>`);break;
 case 'create-account':openModal('创建客户账号',`<form id="account-form"><div class="form-fields">${modalField('公司名称','company','Built Bikes')}${modalField('员工姓名','name')}${modalField('Email','email','','email')}<div class="input-field"><label>账号权限</label><select name="permission" aria-label="账号权限"><option>公司案例查看与申报</option><option>仅查看本人案例</option></select></div></div><div class="notice green">后台开户为本原型方案。客户自助注册及审核方式待确认。</div>${modalActions('创建演示账号')}</form>`);break;
 case 'export':{const list=filtered();download('售后案例_原型演示.csv','\ufeff案例编号,客户,车架号,产品型号,故障部件,案例状态\n'+list.map(x=>[x.id,x.company,x.frame,x.model,x.fault,x.status].map(csv).join(',')).join('\n'),'text/csv');toast('演示案例清单已导出。');break}
 case 'export-stock':download('库存_原型演示.csv','\ufeff车型,物理库存,锁定数量,可用库存\nTRAIL X1,128,12,116\nURBAN S2,86,6,80\nTOURING G3,64,4,60','text/csv');break;

 case 'confirm-reset':cases=clone(initialCases);draft={};uploads=[];role='admin';filter='全部案例';query='';country='';currentId=cases[0].id;persist();closeModal();go('dashboard');toast('初始演示数据已恢复。');break;
 default:toast('请通过页面导航继续体验。');
}}
function csv(s){let value=String(s??'');if(/^[=+\-@]/.test(value))value="'"+value;return '"'+value.replace(/"/g,'""')+'"'}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-nav],[data-action],[data-case],[data-filter],[data-list-filter],[data-tab],[data-page],[data-ship-case],[data-preview],[data-company],[data-vehicle],[data-stock]');if(!target)return;
 if(target.dataset.nav){filter='全部案例';query='';country='';pageNum=1;closeModal();go(target.dataset.nav)}
 else if(target.dataset.action)action(target.dataset.action);
 else if(target.dataset.case){currentId=target.dataset.case;detailTab='info';closeModal();go('detail')}
 else if(target.dataset.filter){filter=target.dataset.filter;query='';country='';pageNum=1;go('cases')}
 else if(target.dataset.listFilter){filter=target.dataset.listFilter;pageNum=1;render()}
 else if(target.dataset.tab){detailTab=target.dataset.tab;render()}
 else if(target.dataset.page){pageNum=+target.dataset.page;render()}
 else if(target.dataset.shipCase){currentId=target.dataset.shipCase;action('ship')}
 else if(target.dataset.preview){openModal(esc(target.dataset.preview),`<div class="attachment-visual" style="height:260px">${target.dataset.preview.endsWith('.jpg')?bike():icon('file',68)}</div><p style="margin-top:16px">附件预览示意。原型只保留文件名，不保存或播放真实文件正文。</p>`)}
 else if(target.dataset.company){const co=target.dataset.company;openModal(esc(co)+' · 成员与权限',`<p>公司员工根据权限共享本公司案例。</p>${[cases.find(x=>x.company===co).contact,'Service Team','Sales Team'].map((n,i)=>`<div class="member"><span class="avatar">${esc(n[0])}</span><div><h3>${esc(n)}</h3><p>${i===0?'管理员 · 公司内全部案例':i===1?'售后成员 · 申报与处理':'只读成员 · 查看公司案例'}</p></div><span class="grow"></span><span class="tag green">启用</span></div>`).join('')}<div class="modal-actions">${btn('新增成员','create-account','primary','plus')}</div>`)}
 else if(target.dataset.vehicle){currentId=target.dataset.vehicle;go('vehicles')}
 else if(target.dataset.stock){openModal(esc(target.dataset.stock)+' · 库存明细',`<div class="fields">${infoField('仓库','华东成品仓')}${infoField('库位','A-02-06')}${infoField('锁定方式','按车型与数量')}</div><div class="line"></div><p>演示明细：Built Bikes 占用 4 台，Vélo Horizon 占用 2 台。锁定不指定具体车架 SN。</p><div class="notice">库存总数与明细仅用于视觉演示，未连接真实库存。</div>`)}
});

 if(e.target.id==='case-upload'||e.target.id==='reply-upload'){const files=Array.from(e.target.files);if(files.some(f=>f.size>20*1024*1024)||files.length>8){toast('演示文件限制：最多 8 个，每个不超过 20 MB。');e.target.value='';return}const names=files.map(f=>f.name);if(e.target.id==='case-upload'){uploads=names;document.getElementById('upload-list').innerHTML=names.map(n=>`<span class="file-pill">${esc(n)}</span>`).join('')}else{replyFiles=names;document.getElementById('reply-files').textContent=names.join('、')}}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target, f=Object.fromEntries(new FormData(form)),c=selected();switch(form.id){
 case 'global-search':query=f.search;filter='全部案例';pageNum=1;go('cases');break;
 case 'case-filters':query=f.query;country=f.country;pageNum=1;render();break;
 case 'new-case-form':{if(role==='customer')f.company='Built Bikes';const suffix=String(Math.max(...cases.map(c=>parseInt(lastOf(c.id.split('-')))||0))+1).padStart(4,'0');const item={...f,id:'TW-AS-20260909-'+suffix,status:'已提交',sub:'待处理',date:'2026-09-09',owner:'Nia',attachments:uploads.slice(),messages:[],history:[],parts:1};cases.unshift(item);audit(item,'客户提交案例，等待售后团队受理。');currentId=item.id;draft={};uploads=[];persist();detailTab='info';go('detail');toast('案例提交成功，已生成唯一编号 '+item.id);break}
 case 'reply-form':if(!String(f.reply||'').trim()&&!replyFiles.length){toast('请输入回复内容或选择附件。');return}c.messages.push({text:String(f.reply||'').trim(),files:replyFiles.slice(),who:role==='customer'?'Chris Wilson':'Nia · 售后',customer:role==='customer'});replyFiles=[];audit(c,'新增案例沟通记录。');render();toast('回复已保存到演示案例。');break;
 case 'approval-form':if(f.decision!=='approve'&&!f.reason.trim()){document.getElementById('modal-error').textContent='拒绝或退回时必须填写原因。';return}if(f.decision==='approve')setStatus(c,'已审批','待发货','审批通过：'+(f.reason||'同意维修方案及免费配件补发。'));else if(f.decision==='supplement')setStatus(c,'处理中','等待客户回复','退回补充资料：'+f.reason);else setStatus(c,'审核中','审批已拒绝','审批拒绝：'+f.reason);break;
 case 'supplement-form':c.messages.push({who:'Nia · 售后',text:f.reason,customer:false});setStatus(c,'处理中','等待客户回复','要求客户补充资料：'+f.reason);break;
 case 'solution-form':c.solution=f.solution;audit(c,'更新技术判断与维修方案。');closeModal();detailTab='repair';render();toast('维修方案已保存。');break;
 case 'shipping-form':Object.assign(c,f);setStatus(c,'已发货','运输中','仓库登记 '+f.carrier+' 运单 '+f.tracking);if(route()==='detail'){detailTab='shipping';render()}break;
 case 'complete-form':setStatus(c,'完成','已归档','确认问题解决并归档：'+f.reason);break;
 case 'status-form':setStatus(c,f.status,f.status==='完成'?'已归档':f.status==='审核中'?'技术确认':'等待客户测试','状态变更：'+f.reason);break;
 case 'return-form':Object.assign(c,f);audit(c,'旧件状态更新为 '+f.returnStatus);closeModal();render();toast('旧件演示状态已更新。');break;
 case 'account-form':closeModal();openModal('演示账号已创建',`<div class="notice green">${esc(f.name)} · ${esc(f.email)}</div><p>公司：${esc(f.company)}<br>权限：${esc(f.permission)}</p><p>此处仅演示创建结果，未发送邀请邮件或创建真实登录账号。</p><div class="modal-actions">${btn('完成','close-modal','primary','check')}</div>`);break;
 case 'vehicle-search':{const match=visibleCases().find(x=>[x.frame,x.motor||'MOT-26-00158',x.battery||'BAT-26-00821'].includes(f.serial.trim()));if(match){currentId=match.id;render();toast('已找到演示车辆档案。')}else toast('演示数据中未找到此 SN，请使用页面已有车架号。');break}
 case 'scan-form':closeModal();openModal('四码演示绑定成功',`<div class="notice green">${icon('check',18)} 四项编码填写完整</div><div class="fields">${Object.entries(f).map(([k,v])=>infoField(({frame:'车架',motor:'电机',battery:'电池',display:'仪表'})[k],esc(v))).join('')}</div><div class="notice">仅展示成功反馈。数据库唯一性校验和硬件扫码未在静态原型中实现。</div><div class="modal-actions">${btn('完成','close-modal','primary')}</div>`);break;
}});
document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(e.key==='Escape'){closeModal();document.querySelector('.sidebar')?.classList.remove('open')}if(modal&&e.key==='Tab'){const elements=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled);const first=elements[0],last=lastOf(elements);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',render);
uploads=Array.isArray(draft.attachments)?draft.attachments:[];
render();

</script>
</body>
</html>
