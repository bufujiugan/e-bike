name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f bike-server/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bike-web, bike-h5]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.app }}
      - run: pnpm build
        working-directory: ${{ matrix.app }}
  mysql-business:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-isolated-test-password
          MYSQL_DATABASE: bike_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f bike-server/pom.xml -Dtest=InventoryLockMysqlTest,InventoryProjectionMysqlTest,SkuCommitmentMysqlTest,PiConversionMysqlTest,PiDispatchMysqlTest,PiLogisticsMysqlTest,PurchaseIntentMysqlTest,LegacyConversionAuditMysqlTest,AfterSalesMysqlTest,AfterSalesAttachmentMysqlTest,AfterSalesCompanyMysqlTest,PiReceiptAttachmentMysqlTest,PiMysqlTest,PaidOrderReservationMysqlTest,StockOutOrderOptionsMysqlTest,AuditPrivacyMysqlTest,MapperResourcesTest test
        env:
          BIKE_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/bike_test?useSSL=false&allowPublicKeyRetrieval=true
          BIKE_MYSQL_TEST_USER: root
          BIKE_MYSQL_TEST_PASSWORD: ci-only-isolated-test-password
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/configure.py
      - run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Verify frontends and first login
        run: |
          curl --fail http://127.0.0.1:5173/production
          curl --fail http://127.0.0.1:5174/
          curl --fail http://127.0.0.1:5173/actuator/health
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          config = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines() if line and not line.startswith('#'))
          request = urllib.request.Request('http://127.0.0.1:5173/api/auth/login', data=json.dumps({'username': 'admin', 'password': config['BIKE_ADMIN_PASSWORD']}).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.load(response)
          assert result['code'] == 'SUCCESS'
          assert result['data']['mustChangePassword'] is True
          print('MySQL-backed first login through Nginx passed.')
          PY
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
