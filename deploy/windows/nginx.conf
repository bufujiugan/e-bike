worker_processes 1;
error_log C:/bike/logs/nginx-error.log warn;
pid C:/bike/runtime/nginx-1.28.0/logs/nginx.pid;
events { worker_connections 1024; }
http {
    include C:/bike/runtime/nginx-1.28.0/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log C:/bike/logs/nginx-access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1025m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name ebike.nfwms.com;
        root C:/bike/current/web;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location = /actuator/health {
            proxy_pass http://127.0.0.1:18080;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name pda.nfwms.com;
        root C:/bike/current/pda;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location = /actuator/health {
            proxy_pass http://127.0.0.1:18080;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
